# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Node.js app to Azure Web App - med-assistant-app

on:
  push:
    branches:
      - ralph-dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Create .env.production file
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.production
          echo "AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}" >> .env.production
          echo "AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}" >> .env.production
          echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> .env.production
          echo "CUSTOM_VISION_KEY=${{ secrets.CUSTOM_VISION_KEY }}" >> .env.production
          echo "CUSTOM_VISION_ENDPOINT=${{ secrets.CUSTOM_VISION_ENDPOINT }}" >> .env.production
          echo "CUSTOM_VISION_PROJECT_ID=${{ secrets.CUSTOM_VISION_PROJECT_ID }}" >> .env.production
          echo "CUSTOM_VISION_ITERATION_NAME=${{ secrets.CUSTOM_VISION_ITERATION_NAME }}" >> .env.production
          echo "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}" >> .env.production
          echo "AZURE_OPENAI_KEY=${{ secrets.AZURE_OPENAI_KEY }}" >> .env.production
          echo "AZURE_OPENAI_DEPLOYMENT=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" >> .env.production
          echo "AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION }}" >> .env.production

      - name: build
        run: |
          npm install
          npm run build

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.ts
            node_modules/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: https://med-assistant-app.azurewebsites.net
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'med-assistant-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.MED_ASSISTANT_PUBLISH_PROFILE }}