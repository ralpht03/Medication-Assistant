name: Build and deploy Node.js app to Azure Web App - med-assistant-app

on:
  push:
    branches:
      - ralph-dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env.local file
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.local
          echo "AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}" >> .env.local
          echo "AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}" >> .env.local
          echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> .env.local
          echo "CUSTOM_VISION_KEY=${{ secrets.CUSTOM_VISION_KEY }}" >> .env.local
          echo "CUSTOM_VISION_ENDPOINT=${{ secrets.CUSTOM_VISION_ENDPOINT }}" >> .env.local
          echo "CUSTOM_VISION_PROJECT_ID=${{ secrets.CUSTOM_VISION_PROJECT_ID }}" >> .env.local
          echo "CUSTOM_VISION_ITERATION_NAME=${{ secrets.CUSTOM_VISION_ITERATION_NAME }}" >> .env.local
          echo "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}" >> .env.local
          echo "AZURE_OPENAI_KEY=${{ secrets.AZURE_OPENAI_KEY }}" >> .env.local
          echo "AZURE_OPENAI_DEPLOYMENT=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" >> .env.local
          echo "AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION }}" >> .env.local

      - name: Build app
        run: |
          npm install
          npm run build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          CUSTOM_VISION_KEY: ${{ secrets.CUSTOM_VISION_KEY }}
          CUSTOM_VISION_ENDPOINT: ${{ secrets.CUSTOM_VISION_ENDPOINT }}
          CUSTOM_VISION_PROJECT_ID: ${{ secrets.CUSTOM_VISION_PROJECT_ID }}
          CUSTOM_VISION_ITERATION_NAME: ${{ secrets.CUSTOM_VISION_ITERATION_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}

      - name: Remove invalid metadata files
        run: |
          find . -type f -name '*:*' -exec rm -f {} +

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.ts

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    environment:
      name: 'Production'
      url: https://med-assistant-app.azurewebsites.net

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'med-assistant-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.MED_ASSISTANT_PUBLISH_PROFILE }}
          clean: true  
